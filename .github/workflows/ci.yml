name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic data
        run: python -m src.generate_data

      - name: Train model
        run: python -m src.train

      - name: Run tests
        run: pytest tests/ -v

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: models/metrics.json
          if-no-files-found: warn

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate data and train model
        run: |
          python -m src.generate_data
          python -m src.train

      - name: Build Docker image
        run: docker build -t predictive-maintenance-api:ci .

      - name: Test Docker image
        run: |
          docker run -d --name test-api -p 8000:8000 predictive-maintenance-api:ci
          sleep 10
          echo "--- Container logs ---"
          docker logs test-api
          echo "--- Health check ---"
          curl -f http://localhost:8000/ || (docker logs test-api && exit 1)
          echo "--- Info endpoint ---"
          curl -f http://localhost:8000/info || (docker logs test-api && exit 1)
          echo "--- Predict endpoint ---"
          curl -f -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"features":[0.5,0.5,0.5,0.5,0.5,0.5,0.5,0.5,0.5,0.5,0.5,0.5,0.5,0.5,0.5,0.5,0.5,0.5,0.5,0.5,0.5]}' \
            || (docker logs test-api && exit 1)
          docker stop test-api
          docker rm test-api
